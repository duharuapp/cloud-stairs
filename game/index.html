<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>구름 계단 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: home = 3D mountain at your current height; game = full-screen canvas, floating HUD counters, round buttons. */
:root{
  --ink:#2b3140; --paper:#ffffff; --sun:#ffc93c; --red:#ff5a4e; --blue:#4fb3ff; --shade:rgba(20,26,50,.55);
  --font:"Jua", "Arial Rounded MT Bold", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(#8fd3ff,#e2f6ff);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;font-family:var(--font)}
.left{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.score{font-size:52px;line-height:1;color:var(--paper);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.score small{font-size:24px;margin-left:2px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.25);color:var(--paper);border-radius:999px;padding:5px 11px 5px 7px;font-size:18px}
.pill svg{width:20px;height:20px}
.hearts{gap:2px;padding:5px 9px}
.hearts svg{transition:transform .2s}
.hearts svg.off{transform:scale(.8)}
svg.off .f{fill:#cfd4de}
.pop svg.bigHeart{width:58px;height:58px}
.hearts.hit{animation:hit .4s}
@keyframes hit{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.round.revive{position:relative}
.round.revive .tag{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:3px 9px;box-shadow:0 3px 0 rgba(0,0,0,.15);font-family:var(--font);color:var(--ink);font-size:18px}
.round.revive .tag svg{width:24px;height:24px}
.round.revive .tag.price svg{width:20px;height:20px}
.round.revive.short .tag{color:var(--red)}
.adbox{width:min(320px,80vw);aspect-ratio:9/16;max-height:70vh;background:#1c2233;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.adlabel{font-size:28px;background:var(--sun);color:var(--ink);border-radius:8px;padding:2px 12px}
.adcount{font-size:64px}
.pop .big{font-size:64px;line-height:1}
.pop .row.sub{font-size:22px;color:#8a8f9c}
.hud .round{pointer-events:auto}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--shade);font-family:var(--font);color:var(--paper)}
.logo{font-size:58px;text-shadow:0 4px 0 rgba(0,0,0,.25);letter-spacing:2px}
.round{width:96px;height:96px;border-radius:50%;border:0;background:var(--sun);box-shadow:0 7px 0 #d9952a;display:grid;place-items:center;cursor:pointer;padding:0}
.round:active{transform:translateY(5px);box-shadow:0 2px 0 #d9952a}
.round:focus-visible{outline:4px solid var(--paper);outline-offset:4px}
.round svg{width:46px;height:46px}
.round.small{width:52px;height:52px;background:var(--blue);box-shadow:0 5px 0 #2f86cc}
.round.small:active{box-shadow:0 1px 0 #2f86cc;transform:translateY(4px)}
.round.small svg{width:28px;height:28px}
.round.tiny{width:44px;height:44px;background:rgba(0,0,0,.28);box-shadow:none}
.round.tiny:active{transform:scale(.92);box-shadow:none}
.round.tiny svg{width:24px;height:24px}
.btns{display:flex;align-items:center;gap:18px}
/* banner ad slot at the very bottom; controls and home buttons sit above it */
:root{--ban:0px}
body.ads{--ban:58px}
.banner{display:none;position:fixed;left:50%;bottom:env(safe-area-inset-bottom,0px);transform:translateX(-50%);width:320px;height:50px;margin-bottom:4px;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.88);border:1.5px dashed #9aa3b5;border-radius:6px;box-sizing:border-box;font-family:var(--font);font-size:15px;color:#7a8396;pointer-events:none}
.banner span{background:#ffc93c;color:var(--ink);border-radius:4px;padding:0 6px;font-size:13px}
body.ads .banner{display:flex}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px + var(--ban));left:0;right:0;display:flex;justify-content:space-between;padding:0 max(20px,env(safe-area-inset-left,0px));pointer-events:none}
.pad .round{pointer-events:auto;width:86px;height:86px;background:rgba(255,255,255,.92);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.pad .round:active,.pad .round.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.pad .round svg{width:44px;height:44px}
.hint{position:fixed;width:56px;height:56px;pointer-events:none;animation:tapme .8s ease-in-out infinite}
@keyframes tapme{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
.pop{background:var(--paper);color:var(--ink);border-radius:28px;padding:22px 40px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.pop svg.flag{width:64px;height:64px}
.pop .row{display:flex;align-items:center;gap:8px;font-size:30px}
.pop .row svg{width:28px;height:28px}
.new{background:var(--red);color:var(--paper);border-radius:999px;padding:4px 14px;font-size:18px}
#floats{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;left:0;top:0;font-family:var(--font);font-size:30px;color:var(--red);-webkit-text-stroke:5px #fff;paint-order:stroke fill}
.prog{position:fixed;right:6px;top:120px;bottom:calc(150px + var(--ban));width:6px;border-radius:3px;background:rgba(0,0,0,.18);pointer-events:none}
.prog i{position:absolute;left:50%;transform:translate(-50%,50%)}
#progBest{width:12px;height:3px;background:var(--sun)}
#progMe{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-sizing:border-box}
.prog .flagtop{position:absolute;top:-18px;left:-6px;width:0;height:0;border-left:11px solid transparent;border-bottom:8px solid transparent;border-right:0;border-top:8px solid var(--red);transform:scaleX(-1)}
body.at-home .hud,body.at-home .pad,body.at-home .prog,body.at-home #floats{display:none}
.layer.home{background:none;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px + var(--ban));box-sizing:border-box;pointer-events:none}
.layer.home > *{pointer-events:auto}
.homeTop{width:100%;display:flex;align-items:center;gap:8px}
.homeTop .grow{flex:1}
.pill.mtn{font-size:22px;padding:6px 14px 6px 9px}
.pill.mtn svg{width:26px;height:26px}
.side{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:16px}
.side .round{position:relative}
.dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);border:2px solid #fff;box-sizing:border-box;font-size:12px;line-height:14px;text-align:center;color:#fff}
.homeBottom{display:flex;flex-direction:column;align-items:center;gap:14px}
.stageDots{display:flex;gap:6px;background:rgba(0,0,0,.22);border-radius:999px;padding:7px 10px}
.stageDots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35)}
.stageDots i.done{background:var(--sun)}
.stageDots i.now{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.round.play{width:112px;height:112px;position:relative}
.round.play svg{width:54px;height:54px}
.lv{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:999px;padding:2px 12px;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.closeX{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px}
.att{padding:22px 20px 26px}
.attGrid{display:grid;grid-template-columns:repeat(4,64px);gap:8px}
.cell{position:relative;height:78px;border-radius:16px;background:#f1f3f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;color:#8a8f9c}
.cell svg{width:26px;height:26px}
.cell b{font-size:17px;color:var(--ink);font-weight:normal}
.cell.wide{grid-column:span 2}
.cell.wide svg{width:34px;height:34px}
.cell.done{opacity:.45}
.cell.done::after{content:"";position:absolute;inset:0;margin:auto;width:30px;height:16px;border-left:5px solid #47b36b;border-bottom:5px solid #47b36b;transform:translateY(-4px) rotate(-45deg)}
.cell.today{background:#fff4cf;box-shadow:inset 0 0 0 3px var(--sun);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:inset 0 0 0 3px var(--sun),0 0 14px rgba(255,201,60,.8)}}
.round:disabled{filter:grayscale(1);opacity:.5;cursor:default}
.mini{padding:24px 22px 30px;gap:16px}
.tries{display:flex;gap:6px}
.tries i{width:14px;height:14px;border-radius:50%;background:var(--blue)}
.tries i.used{background:#d8dbe3}
.gauge{position:relative;width:min(280px,72vw);height:34px;border-radius:17px;background:#e9ecf3;overflow:hidden}
.gauge .z1{position:absolute;top:0;bottom:0;left:30%;width:40%;background:#cfe6ff}
.gauge .z2{position:absolute;top:0;bottom:0;left:44%;width:12%;background:var(--sun)}
.needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;border-radius:3px;background:var(--ink)}
.bellRow{width:min(280px,72vw);display:flex;justify-content:center}
.bellRow span{display:inline-block;transform-origin:50% 10%}
.bellRow svg{width:50px;height:50px;display:block}
.bellRow span.ring{animation:ring .6s ease-in-out 2}
@keyframes ring{25%{transform:rotate(18deg)}75%{transform:rotate(-18deg)}}
.miniRes{height:34px;display:flex;align-items:center;gap:6px;font-size:30px}
.miniRes svg{width:28px;height:28px}
.round.go{position:relative}
.clearCoins{display:flex;align-items:center;gap:6px;font-size:30px;color:#e09a1c}
.clearCoins svg{width:30px;height:30px}
.coinPill{padding-right:5px}
.plus{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer;margin-left:3px;display:grid;place-items:center}
.plus svg{width:28px;height:28px}
.plus:active{transform:scale(.9)}
.round.tiny{position:relative}
.round.small.green{background:#47c16a;box-shadow:0 5px 0 #2f9a4f}
.round.small.grey{background:#aab3c5;box-shadow:0 5px 0 #7f8aa0}
.round.small.shopBtn{background:#ffb84d;box-shadow:0 5px 0 #d98a1c}
.pop.shop{padding:20px 18px 24px;gap:14px}
.bal{display:flex;align-items:center;gap:6px;font-size:30px}
.bal svg{width:32px;height:32px}
.shopAd{position:relative;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:18px;background:var(--blue);box-shadow:0 5px 0 #2f86cc;color:#fff;font-family:var(--font);font-size:28px;padding:10px 16px;cursor:pointer;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.shopAd svg{width:34px;height:34px}
.shopAd:active{transform:translateY(4px);box-shadow:0 1px 0 #2f86cc}
.shopAd:disabled{filter:grayscale(1);opacity:.5}
.shopAd .dot{top:-6px;right:-6px;-webkit-text-stroke:0;font-size:13px;min-width:22px;height:22px;line-height:18px;border-radius:11px}
.packs{display:grid;grid-template-columns:repeat(2,132px);gap:10px}
.pack{border:0;border-radius:18px;background:#f1f3f8;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 12px;font-family:var(--font);color:var(--ink);cursor:pointer}
.pack svg{width:66px;height:56px}
.pack b{font-size:24px;font-weight:normal}
.pack .price{background:#47c16a;color:#fff;border-radius:999px;padding:3px 12px;font-size:17px;box-shadow:0 3px 0 #2f9a4f;margin-top:4px}
.pack.best{background:#fff4cf;box-shadow:inset 0 0 0 3px var(--sun)}
.pack:active{transform:scale(.96)}
.pop.set{padding:26px 26px 28px;gap:18px}
.acct{display:flex;flex-direction:column;align-items:center;gap:12px}
.login{display:flex;align-items:center;justify-content:center;gap:10px;width:230px;height:54px;border:0;border-radius:16px;font-family:var(--font);font-size:23px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.login svg{width:28px;height:28px}
.login.apple{background:#111;color:#fff}
.login.google{background:#fff;color:#3c4043;box-shadow:inset 0 0 0 2px #dadce0,0 4px 0 rgba(0,0,0,.12)}
.login:active{transform:translateY(3px)}
.native #acctOut,.native #acctIn,.native #gearDot{display:none!important}
.who{display:flex;align-items:center;gap:8px;font-size:24px}
.prov{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f1f3f8}
.prov.apple{background:#111}
.prov svg{width:24px;height:24px}
.bkTime{display:flex;align-items:center;gap:6px;font-size:18px;color:#8a8f9c}
.bkTime svg{width:24px;height:24px}
.restIc{width:64px;height:64px}
.restRow{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;background:#f1f3f8;border-radius:999px;padding:5px 12px 5px 7px;font-size:22px}
.chip svg{width:24px;height:24px}
.spin{width:56px;height:56px;border-radius:50%;border:6px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.pill svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.15))}
.round.small.closetBtn{background:#ff8fb8;box-shadow:0 5px 0 #d9608c}
.round.tog.off{background:#c3c9d6;box-shadow:0 5px 0 #98a0b2}
.round.tog.off::after{content:"";position:absolute;width:44px;height:5px;background:var(--red);border:2px solid var(--ink);border-radius:4px;transform:rotate(-45deg)}
.round.tog{position:relative}
.stageDots button{width:16px;height:16px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.35);cursor:default}
.stageDots button.done{background:var(--sun);cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.stageDots button.now{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.stageDots button.done.full{background:#ff9f1c}
.stageDots{gap:7px}
.wStars{display:flex;gap:4px;align-items:flex-end}
.wStars svg{width:46px;height:46px}
.wStars svg:nth-child(2){width:58px;height:58px}
.wStars svg.pin{animation:starIn .35s ease-out both}
@keyframes starIn{from{transform:scale(0)}70%{transform:scale(1.25)}}
.wGoals{display:flex;gap:6px}
.goal{display:flex;align-items:center;gap:4px;background:#f1f3f8;border-radius:999px;padding:4px 10px 4px 6px;font-size:18px;color:#8a8f9c}
.goal svg{width:22px;height:22px}
.goal.ok{background:#fff4cf;color:var(--ink)}
.noadsBtn{position:relative;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:18px;background:#f1f3f8;padding:8px 14px;cursor:pointer;font-family:var(--font)}
.noadsBtn svg{width:58px;height:58px}
.noadsBtn .price{background:#47c16a;color:#fff;border-radius:999px;padding:3px 12px;font-size:17px;box-shadow:0 3px 0 #2f9a4f}
.noadsBtn.owned{opacity:.5;pointer-events:none}
.noadsBtn.owned .price{background:#aab3c5;box-shadow:none}
.pop.intro{padding:20px 22px}
.introPics{display:flex;flex-direction:column;gap:10px}
.pic{background:#f1f3f8;border-radius:18px;padding:8px 14px}
.pic svg{width:190px;height:118px;display:block}
.layer.closet{background:none;justify-content:flex-end;pointer-events:none}
.sheet{pointer-events:auto;width:100%;max-width:520px;box-sizing:border-box;background:#fff;color:var(--ink);border-radius:26px 26px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 0 rgba(0,0,0,.08)}
.sheetTop{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;flex:1}
.tabs button{width:48px;height:48px;border-radius:14px;border:0;background:#f1f3f8;display:grid;place-items:center;cursor:pointer}
.tabs button svg{width:30px;height:30px}
.tabs button.on{background:#fff4cf;box-shadow:inset 0 0 0 3px var(--sun)}
.round.tiny.dark{background:#c3c9d6}
.wGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wcell{position:relative;aspect-ratio:1;border:0;border-radius:16px;background:#f1f3f8;display:grid;place-items:center;cursor:pointer;padding:0}
.wcell svg{width:58%;height:58%}
.wcell.on{background:#fff4cf;box-shadow:inset 0 0 0 3px var(--sun)}
.wcell .cost{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;font-family:var(--font);font-size:13px;color:var(--ink);background:#fff;border-radius:999px;padding:1px 6px 1px 3px;white-space:nowrap}
.wcell .cost svg{width:14px;height:14px}
.wcell .tick{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#47c16a;display:grid;place-items:center}
.wcell .tick svg{width:18px;height:18px}
.buyBtn{align-self:center;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#47c16a;box-shadow:0 5px 0 #2f9a4f;color:#fff;font-family:var(--font);font-size:26px;padding:8px 26px 8px 14px;cursor:pointer;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.buyBtn svg{width:30px;height:30px}
.buyBtn{min-width:150px;justify-content:center;min-height:52px}
.buyBtn svg:nth-of-type(2){display:none}
.buyBtn.worn{background:#c3c9d6;box-shadow:0 5px 0 #98a0b2;cursor:default}
.buyBtn.worn svg:nth-of-type(1){display:none}
.buyBtn.worn svg:nth-of-type(2){display:block}
.buyBtn.worn:active{transform:none;box-shadow:0 5px 0 #98a0b2}
.buyBtn.short{background:#aab3c5;box-shadow:0 5px 0 #7f8aa0}
.buyBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #2f9a4f}
/* side icons stand on their own: no round plate, just the big outlined icon */
.side .round.small,.side .round.small:active{background:none;box-shadow:none;width:64px;height:64px}
.side .round.small svg{width:60px;height:60px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.22))}
.side .round.small:active{transform:scale(.9)}
.layer > .btns .round.small,.layer > .btns .round.small:active{background:none;box-shadow:none;width:76px;height:76px}
.layer > .btns .round.small svg{width:70px;height:70px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.22))}
.layer > .btns .round.small:active{transform:scale(.9)}
#over > .btns{gap:6px}
#over > .btns .round.small{width:64px}
.side .dot{top:2px;right:0}
.chip.big{font-size:28px;padding:6px 16px 6px 10px}
.chip.big svg{width:34px;height:34px}
.summitPop .flag{animation:starIn .5s ease-out both}
#summit{background:rgba(20,26,50,.35)}
#home.dressing .side,#home.dressing .homeBottom{display:none}
@media (prefers-reduced-motion: reduce){.cell.today{animation:none}.round:active{transform:none}.hint{animation:none}}

/* ---------- home v2 (10/27): game-style top bar, grounded side icons, stone trail, bigger play ---------- */
.homeTop{gap:9px;padding-left:12px;box-sizing:border-box}
.homeTop .pill{flex-shrink:0}
.homeTop .pill{position:relative;height:38px;box-sizing:border-box;background:rgba(24,32,58,.55);border:2.5px solid rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18);padding:0 10px 0 31px;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);min-width:58px;justify-content:flex-end}
.homeTop .pill svg,.homeTop .pill.mtn svg{position:absolute;left:-12px;top:50%;width:40px;height:40px;transform:translateY(-50%);filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.homeTop .pill.mtn{padding:0 14px 0 32px;font-size:21px}
.homeTop .coinPill{padding-right:4px}
.homeTop .coinPill .plus{position:static;width:30px;height:30px;margin-left:6px}
.homeTop .coinPill .plus svg{position:static;transform:none;width:30px;height:30px}
.homeTop .round.tiny{width:46px;height:46px;background:rgba(24,32,58,.55);border:2.5px solid rgba(255,255,255,.85);box-sizing:border-box}
.side{top:calc(env(safe-area-inset-top,0px) + 92px);gap:14px;left:12px}
.side .round.small{animation:sideBob 3.2s ease-in-out infinite}
.side .round.small:nth-child(2){animation-delay:-.8s}
.side .round.small:nth-child(3){animation-delay:-1.6s}
.side .round.small:nth-child(4){animation-delay:-2.4s}
.side .round.small::before{content:"";position:absolute;left:12px;right:12px;bottom:-6px;height:10px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.28),rgba(0,0,0,0) 70%);z-index:-1}
@keyframes sideBob{0%,100%{translate:0 0}50%{translate:0 -4px}}
.homeBottom{gap:22px}
.trail{position:relative;display:flex;align-items:flex-end;gap:5px;padding:10px 14px 8px;background:rgba(24,32,58,.42);border:2px solid rgba(255,255,255,.55);border-radius:22px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.trail button{position:relative;width:24px;height:14px;padding:0;border:2px solid rgba(43,49,64,.55);border-radius:6px;background:rgba(255,255,255,.28);cursor:default;transition:transform .2s}
.trail button.done{background:linear-gradient(#d9935a,#b06a36);border-color:#2b3140;cursor:pointer}
.trail button.done::after{content:"";position:absolute;left:50%;top:-11px;width:2px;height:10px;background:#2b3140;border-radius:1px}
.trail button.done::before{content:"";position:absolute;left:calc(50% + 2px);top:-11px;border-left:8px solid #ff5a4e;border-top:4px solid transparent;border-bottom:4px solid transparent}
.trail button.done.full::before{border-left-color:#ffc93c}
.trail button.now{background:#fff;border-color:#2b3140;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.trail button.now svg{position:absolute;left:50%;bottom:8px;width:30px;height:30px;transform:translateX(-50%);animation:sideBob 1.4s ease-in-out infinite}
.trail .peak{width:34px;height:34px;margin-left:2px;align-self:flex-end;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.round.play{width:124px;height:124px;box-shadow:0 8px 0 #d9952a,0 0 0 8px rgba(255,255,255,.28)}
.round.play svg{width:60px;height:60px}
.round.play .lv{font-size:22px;padding:3px 16px;bottom:-16px;border:2.5px solid var(--ink)}
.round.play::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid rgba(255,255,255,.7);animation:playRing 1.8s ease-out infinite;pointer-events:none}
@keyframes playRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35);opacity:0}}

/* popup close: pinned to the card's top-right corner (game style), tap outside also closes */
.pop{position:relative}
.pop > .closeX{position:absolute;top:-18px;right:-18px;left:auto;width:48px;height:48px;background:#ff5a4e;border:3px solid #fff;box-shadow:0 0 0 2.5px var(--ink),0 4px 0 2.5px rgba(0,0,0,.25);z-index:2}
.pop > .closeX svg{width:26px;height:26px}
.pop > .closeX:active{transform:scale(.9)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="floats"></div>
<div class="prog"><span class="flagtop"></span><i id="progBest"></i><i id="progMe"></i></div>

<div class="pad">

</div>

<div class="layer home" id="home">

    <button class="round tiny" id="gear" aria-label="settings"><i data-ic="gear"></i><span class="dot" id="gearDot" hidden></span></button>
  </div>
  <div class="side">
    <button class="round small" id="attBtn" aria-label="daily check-in"><i data-ic="calendar"></i><span class="dot" id="attDot" hidden></span></button>
    <button class="round small" id="miniBtn" aria-label="bell minigame"><i data-ic="bell"></i><span class="dot" id="miniDot" hidden></span></button>

    <button class="round play" id="play" aria-label="play"><i data-ic="play"></i><span class="lv" id="lvTag">Lv 1</span></button>
  </div>
</div>

<!-- banner ad slot (AdMob 320x50 in the app); gone after remove-ads -->
<div class="banner" id="banner"><span>AD</span> 320 × 50</div>
<div class="layer" id="att" hidden>
  <button class="round tiny closeX" id="attClose" aria-label="close"><i data-ic="close"></i></button>

    <div class="attGrid" id="attGrid"></div>
  </div>
  <button class="round" id="attClaim" aria-label="claim"><i data-ic="check"></i></button>
</div>

<div class="layer" id="mini" hidden>
  <button class="round tiny closeX" id="miniClose" aria-label="close"><i data-ic="close"></i></button>
  <div class="pop mini">
    <div class="tries" id="tries"></div>
    <div class="bellRow"><span id="miniBell"><i data-ic="bell"></i></span></div>
    <div class="gauge"><div class="z1"></div><div class="z2"></div><div class="needle" id="needle"></div></div>
    <div class="miniRes" id="miniRes"></div>
  </div>

</div>

<div class="layer" id="over" hidden>

    <div class="big"><span id="oH">0</span><small style="font-size:28px">m</small></div>

<div class="layer" id="win" hidden>

  </div>
</div>

<div class="layer" id="shop" hidden>
  <button class="round tiny closeX" id="shopClose" aria-label="close"><i data-ic="close"></i></button>

<div class="layer" id="set" hidden>

<div class="layer" id="rest" hidden>
  <div class="pop">
    <i data-ic="cloudDown" class="restIc"></i>
    <div class="restRow"><div class="chip"><i data-ic="mountain"></i><span id="rLv">Lv 1</span></div><div class="chip"><i data-ic="coin"></i><span id="rCoins">0</span></div></div>

<div class="layer" id="intro" hidden>

<script>
(() => {
// ---------- icons: game-style, filled, with a dark outline ----------
const INK = '#2b3140', O = 'stroke="' + INK + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"';
const ln = (d, c, w) => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="' + (w + 2.8) + '" stroke-linecap="round" stroke-linejoin="round"/><path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';
const HEART = 'M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.7 3.9 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.3 0 5.6 3.2 4.4 6.7C19.5 15.9 12 20.5 12 20.5z';
const CLOUD = 'M7.2 19a4.6 4.6 0 0 1-.7-9.1 5.8 5.8 0 0 1 11.1 1.3A3.9 3.9 0 0 1 17.6 19z';
const coinAt = (x, y, r) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#ffc93c" ' + O + '/><circle cx="' + x + '" cy="' + y + '" r="' + (r * .66) + '" fill="#ffb21e"/><path d="M' + x + ' ' + (y - r * .36) + 'v' + (r * .72) + '" stroke="#fff3c4" stroke-width="' + (r * .24) + '" stroke-linecap="round"/><path d="M' + (x - r * .62) + ' ' + (y - r * .4) + 'a' + (r * .74) + ' ' + (r * .74) + ' 0 0 1 ' + (r * .4) + '-' + (r * .34) + '" stroke="#fff" stroke-width="' + (r * .17) + '" fill="none" stroke-linecap="round"/>';
function gearPath(){
  let d = '';
  for (let i = 0; i < 16; i++){
    const a = i / 16 * Math.PI * 2 - Math.PI / 16, r = i % 2 ? 7 : 9.4, a2 = a + Math.PI / 8;
    d += (i ? 'L' : 'M') + (12 + Math.sin(a) * r).toFixed(2) + ' ' + (12 - Math.cos(a) * r).toFixed(2) + 'L' + (12 + Math.sin(a2) * r).toFixed(2) + ' ' + (12 - Math.cos(a2) * r).toFixed(2);
  }
  return d + 'z';
}
const ICONS = {
  coin: coinAt(12, 12, 9.2),
  heart: '<path class="f" d="' + HEART + '" fill="#ff5a4e" ' + O + '/><ellipse cx="7.4" cy="8.7" rx="1.9" ry="1.2" fill="#fff" opacity=".85" transform="rotate(-38 7.4 8.7)"/>',
  crown: '<path d="M3.3 8.3l4.4 3.7L12 5.3l4.3 6.7 4.4-3.7-1.9 10.4H5.2z" fill="#ffc93c" ' + O + '/><path d="M5.8 15.6h12.4" stroke="#e0901a" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="12.6" r="1.4" fill="#ff5a4e" stroke="' + INK + '" stroke-width="1"/>',
  mountain: '<path d="M1.8 20L9 7.3l3.6 5.8 2.9-4.3L22.2 20z" fill="#6cc16a" ' + O + '/><path d="M9 7.3l2.4 3.9-1.5-.5-1.2 1.1-1.2-.9-1 .4z" fill="#fff"/><path d="M15.5 8.8l1.9 3-1-.3-.9.7-.8-.6-.8.2z" fill="#fff"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15" rx="3" fill="#fff" ' + O + '/><path d="M3.5 10.2V8a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3v2.2z" fill="#ff6b5e" ' + O + '/>' + ln('M8 3v3.6M16 3v3.6', '#fff', 1.6) + ln('M8.6 14.7l2.3 2.2 4.6-4.6', '#47c16a', 2.2),
  bell: '<path d="M12 3c-3.4 0-5.7 2.7-5.7 6.2v3.7l-1.9 3.7h15.2l-1.9-3.7V9.2C17.7 5.7 15.4 3 12 3z" fill="#ffc93c" ' + O + '/><circle cx="12" cy="19.3" r="2" fill="#e0901a" ' + O + '/><path d="M9.2 6.6a3.6 3.6 0 0 0-1 2.4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  sound: '<path d="M3.5 9.3h3.8L12 5.3v13.4l-4.7-4H3.5z" fill="#fff" ' + O + '/>' + ln('M15.6 9.2a3.9 3.9 0 0 1 0 5.6M18.3 6.6a7.5 7.5 0 0 1 0 10.8', '#fff', 1.8),
  mute: '<path d="M3.5 9.3h3.8L12 5.3v13.4l-4.7-4H3.5z" fill="#fff" ' + O + '/>' + ln('M15.6 9.6l4.8 4.8m0-4.8l-4.8 4.8', '#ff5a4e', 2),
  house: '<rect x="15.6" y="3.6" width="3.2" height="6" rx=".6" fill="#d9493f" ' + 'stroke="' + INK + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + '/>' + '<path d="M4.8 10.6L12 4.4l7.2 6.2v9.2a1.6 1.6 0 0 1-1.6 1.6H6.4a1.6 1.6 0 0 1-1.6-1.6z" fill="#fff6e6" ' + 'stroke="' + INK + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + '/>' + '<path d="M5.8 18.4h12.4v1.4a.6.6 0 0 1-.6.6H6.4a.6.6 0 0 1-.6-.6z" fill="#efd6b4"/>' + '<path d="M9.6 21.4v-4.6a2.4 2.4 0 0 1 4.8 0v4.6z" fill="#ffb35c" ' + 'stroke="' + INK + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + '/>' + '<path d="M1.6 11.4L12 2.4l10.4 9a1 1 0 0 1 .1 1.4l-1.2 1.4a1 1 0 0 1-1.4.1L12 7.6 4.1 14.3a1 1 0 0 1-1.4-.1l-1.2-1.4a1 1 0 0 1 .1-1.4z" fill="#ff5a4e" ' + 'stroke="' + INK + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + '/>' + '<path d="M4.2 11.2L12 4.6" stroke="#ffb0a8" stroke-width="1.1" stroke-linecap="round"/>',
  play: '<path d="M8 4.9v14.2c0 .8.9 1.3 1.6.9l10.9-7.1c.6-.4.6-1.3 0-1.7L9.6 4.1C8.9 3.6 8 4.1 8 4.9z" fill="#fff" ' + O + '/>',
  flag: '<path d="M6 2.5v19" stroke="' + INK + '" stroke-width="3.6" stroke-linecap="round"/><path d="M6 2.5v19" stroke="#a87b52" stroke-width="1.6" stroke-linecap="round"/><path d="M7 3.5h11.5l-2.8 4 2.8 4H7z" fill="#ff5a4e" ' + O + '/>',
  clock: '<circle cx="12" cy="13" r="8" fill="#fff" ' + O + '/><path d="M12 9v4.4l3 2" fill="none" stroke="' + INK + '" stroke-width="2" stroke-linecap="round"/>' + ln('M9.6 2.6h4.8', '#4fb3ff', 1.6),
  falls: ln('M12 3.5v14M6.3 12.8l5.7 6.2 5.7-6.2', '#ff5a4e', 2.4),
  check: ln('M5.5 12.5l4.5 4.5 8.5-9.5', '#fff', 2.8),
  close: ln('M6.6 6.6l10.8 10.8M17.4 6.6L6.6 17.4', '#fff', 2.4),
  retry: '<path d="M19.88 14.39A8 8 0 1 1 12 5V1.4L18.6 6.8 12 12.2V8.6A4.4 4.4 0 1 0 16.33 13.76z" fill="#4fb3ff" stroke="' + INK + '" stroke-width="2" stroke-linejoin="round"/>' + '<path d="M6.4 11.4a6.2 6.2 0 0 1 3.4-4.1" stroke="#c6e6ff" stroke-width="1.2" fill="none" stroke-linecap="round"/>',
  ad: '<rect x="2.5" y="5" width="19" height="14" rx="3" fill="#4fb3ff" ' + O + '/><path d="M10 9.1v5.8l4.9-2.9z" fill="#fff" stroke="' + INK + '" stroke-width="1.2" stroke-linejoin="round"/>',
  gear: '<path d="' + gearPath() + '" fill="#fff" ' + O + '/><circle cx="12" cy="12" r="3" fill="#8ea0c4" ' + O + '/>',
  plus: '<circle cx="12" cy="12" r="9.6" fill="#47c16a" ' + O + '/>' + ln('M12 7.6v8.8M7.6 12h8.8', '#fff', 2.2),

const NATIVE = window.ReactNativeWebView ? (() => {

  return {
    call(type, data){ return new Promise(res => { const id = ++n; wait[id] = res; post(Object.assign({ id, type }, data)); }); },
    send(type, data){ post(Object.assign({ type }, data)); }

})() : null;

  set(k, v){ const t = JSON.stringify(v); saved[k] = t; NATIVE.send('save', { k, v: t }); }
} : {

// ---------- course: fixed, the same every run (learnable, like a hand-made map) ----------
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let plats = [], byRow = [];
function add(p){ plats.push(p); (byRow[p.row] || (byRow[p.row] = [])).push(p); }
// a mountain is 10 levels; each level is its own fixed course and brings in one new trick
const KINDS = [[], ['crack'], ['blink'], ['crack', 'blink'], ['slide'], ['cone'], ['slide', 'cone'], ['crack', 'blink', 'slide'], ['crack', 'blink', 'slide', 'cone'], ['crack', 'blink', 'slide', 'cone']];
const LENGTHS = [40, 50, 50, 60, 60, 70, 70, 80, 90, 100];
function stageDef(m, st){
  const k = KINDS[st];
  return { m, s: st, lv: m * STAGES + st + 1, top: LENGTHS[st] + m * 20, steps: k.filter(x => x !== 'cone'), cone: k.includes('cone'),
           seed: 1000 + m * 100 + st, p: Math.min(0.6, 0.42 + m * 0.06), bonus: 50 + st * 10 + m * 20 };
}
function build(D){
  plats = []; byRow = []; TOP = D.top;
  const R = mulberry(D.seed);
  add({ row: 0, x0: 0, x1: COLS - 1, type: 'ground' });
  let x = 4, d = 1, run = 2, lastSlide = -9, prev = 'stair';
  const gentle = D.m === 0 && D.s === 0;
  for (let r = 1; r <= TOP; r++){
    const inSeg = (r - 1) % LAND;
    if (r === TOP){ add({ row: r, x0: 0, x1: COLS - 1, type: 'top' }); break; }
    if (r % LAND === 0){
      const nx = Math.max(0, Math.min(COLS - 1, x + d));
      const x0 = Math.max(0, Math.min(COLS - 5, nx - 2)), x1 = x0 + 4;
      add({ row: r, x0, x1, type: 'land' });
      // leave from the far edge, so the landing has to be walked
      if (nx - x0 >= x1 - nx){ x = x0; d = -1; } else { x = x1; d = 1; }
      if (x + d < 0 || x + d > COLS - 1) d = -d;
      run = 2 + Math.floor(R() * 3); prev = 'stair';
      continue;
    }
    if (run <= 0){ d = -d; run = gentle ? 1 + Math.floor(R() * 4) : 2 + Math.floor(R() * 6); }   // longer runs = longer falls
    if (x + d < 0 || x + d > COLS - 1){ d = -d; run = 1 + Math.floor(R() * 4); }
    x += d; run--;
    let kind = '';
    const roll = R(), pick = R();
    if (inSeg >= 3 && D.steps.length && roll < D.p) kind = D.steps[Math.floor(pick * D.steps.length)];
    // never make the player wait on a step that won't hold still
    if ((kind === 'slide' && prev !== 'stair') || (kind === 'blink' && prev === 'crack')) kind = '';
    if (kind === 'slide' && (r - lastSlide < 3 || x + 2 * d < 0 || x + 2 * d > COLS - 1)) kind = '';
    if (kind === 'slide'){
      const a = x, b = x + 2 * d;
      add({ row: r, type: 'slide', a, b, x0: Math.min(a, b), x1: Math.max(a, b), ph: (r * 0.7) % 3.4 });
      x = b; lastSlide = r; run = Math.max(run - 1, 0);
    } else {
      add({ row: r, x0: x, x1: x, type: kind || 'stair', ph: -r * 0.42 });
    }
    prev = kind || 'stair';
  }
  const C = mulberry(D.seed + 7);
  for (const p of plats) if (p.type === 'stair' && p.row > 2 && C() < 0.3) p.coin = true;
}

const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const SLIDE_T = 3.4;
function slideK(p, t){
  const u = ((t + p.ph) % SLIDE_T + SLIDE_T) % SLIDE_T;
  if (u < 1.1) return 0;
  if (u < 1.7) return ease((u - 1.1) / .6);
  if (u < 2.8) return 1;
  return 1 - ease((u - 2.8) / .6);
}
const slideX = (p, t) => p.a + (p.b - p.a) * slideK(p, t);
const BLINK_T = 2.6, BLINK_ON = 1.6;
const blinkU = (p, t) => ((t + p.ph) % BLINK_T + BLINK_T) % BLINK_T;
function solid(p, t){
  if (p.type === 'crack') return !(p.brokeAt && t < p.brokeAt + 3);
  if (p.type === 'blink') return blinkU(p, t) < BLINK_ON;
  return true;
}
function covers(p, col, t){
  if (p.type === 'slide') return Math.abs(slideX(p, t) - col) < 0.5;
  return col >= p.x0 && col <= p.x1;
}
function platAt(col, row, t, needSolid){
  const L = byRow[row]; if (!L) return null;
  for (const p of L) if (covers(p, col, t) && (!needSolid || solid(p, t))) return p;
  return null;
}

// ---------- sound ----------
let ac = null, soundOn = store.get('sound', true);
function beep(f0, f1, dur, type = 'sine', vol = .12){
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(f1, n + dur);
    g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.001, n + dur);
    o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + dur);
  } catch(e){}
}

// ---------- state ----------
let me, gt = 0, camY = 0, falls = 0, playTime = 0, best = 0;
let prog = store.get('prog', { m: 0, s: 0 });

function newRun(save){
  const at = playAt || prog; def = stageDef(at.m, at.s);
  if (save && save.lv !== def.lv) save = null;

  build(def); buildWorld();
  me = { mode: 'idle', x: 4, y: 0, face: 1, plat: byRow[0][0], hx: 0, hy: 0, tx: 0, ty: 0, h: 0, vy: 0, from: 0, squash: 0 };
  falls = 0; playTime = 0; gt = 0; hearts = MAX_HEARTS; check = { x: 4, y: 0 }; runCoins = 0;
  if (save && save.y > 0){
    runCoins = save.runCoins || 0;
    for (const r of save.taken || []) for (const q of byRow[r] || []) if (q.coin) q.coinTaken = true;
    const p = platAt(save.x, save.y, 0, false);
    if (p && p.type !== 'slide'){ me.x = save.x; me.y = save.y; me.plat = p; }
    falls = save.falls || 0; playTime = save.time || 0;
    hearts = save.hearts || MAX_HEARTS; if (save.check) check = save.check;
  }
  setHearts(); setRunCoins();
  camY = me.y; buffer = []; cones = []; fx = []; floats = [];
}
function saveNow(){
  if (me.mode !== 'idle' || !me.plat) return;
  if (['stair', 'land', 'ground'].includes(me.plat.type)) store.set('save', { lv: def.lv, x: Math.round(me.x), y: me.y, falls, time: playTime, hearts, check, runCoins, taken: plats.filter(q => q.coinTaken).map(q => q.row) });
}

// ---------- moves ----------
const HOP = 0.1;
function press(d){
  if (state !== 'play') return;
  const b = document.getElementById(d < 0 ? 'L' : 'R');
  b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 90);
  if (me.mode === 'hop'){ if (buffer.length < 2) buffer.push(d); return; }
  if (me.mode === 'idle') step(d);
}
function step(d){
  me.face = d;
  const col = Math.round(me.x), row = me.y, nc = col + d;
  // stepping off the edge of the course is a wrong step too: hop out and drop past your own block
  if ((nc < 0 || nc > COLS - 1) && (row === 0 || !me.plat)){ me.squash = .5; beep(180, 140, .06, 'square', .05); return; }
  if (nc < 0 || nc > COLS - 1){
    me.mode = 'hop'; me.hx = me.x; me.hy = me.y; me.tx = col + d * .45; me.ty = row + .6; me.h = 0; me.edge = me.plat; me.plat = null;
    return;
  }
  let tr = row + 1;
  if (!platAt(nc, row + 1, gt, false) && platAt(nc, row, gt, false)) tr = row;   // walk along a landing
  else if (!platAt(nc, row + 1, gt, false) && row > 0 && platAt(nc, row - 1, gt, false)) tr = row - 1;   // step back down one (dodging a cone): not a fall
  me.mode = 'hop'; me.hx = me.x; me.hy = me.y; me.tx = nc; me.ty = tr; me.h = 0; me.plat = null;
}
function startFall(vy, skip){
  me.skip = skip || null;   // a step the player is knocked off of doesn't catch them again
  me.mode = 'fall'; me.vy = vy; me.from = me.y; me.plat = null; buffer = []; combo = 0;
  beep(620, 160, .45, 'triangle', .08);
}
function land(p, fell){
  me.mode = 'idle'; me.plat = p; me.squash = 1;
  if (p.coin && !p.coinTaken) takeCoin(p);

function starCount(m){ let n = 0; for (let s = 0; s < STAGES; s++){ const b = starsOf(m * STAGES + s + 1); n += (b & 1) + (b >> 1 & 1) + (b >> 2 & 1); } return n; }

// ---------- wardrobe: hats, colours, fall trails ----------
const WARDROBE = {
  hat: [{ id: 'h0', ic: 'none', c: 0 }, { id: 'h1', ic: 'hat_straw', c: 300 }, { id: 'h2', ic: 'hat_ribbon', c: 400 }, { id: 'h3', ic: 'hat_beanie', c: 600 }, { id: 'h4', ic: 'hat_cap', c: 800 }, { id: 'h5', ic: 'hat_crown', c: 2000 }],
  col: [{ id: 'c0', v: 0xfff6e6, c: 0 }, { id: 'c1', v: 0xffd0c2, c: 300 }, { id: 'c2', v: 0xbfe4ff, c: 300 }, { id: 'c3', v: 0xbff0d8, c: 300 }, { id: 'c4', v: 0xfff0a0, c: 500 }, { id: 'c5', v: 0xdcccff, c: 500 }, { id: 'c6', v: 0xb98a66, c: 800 }],

const wItem = id => { for (const k in WARDROBE) for (const it of WARDROBE[k]) if (it.id === id) return it; };
function buildHat(id){
  const g = new THREE.Group(); g.name = 'hat';
  const L = (c, x) => lam(c, x || {});   // smooth shading: soft, round hats
  const M = (geo, mat, sx, sy, sz, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  const cyl = new THREE.CylinderGeometry(1, 1, 1, 32), ball = hatBall, tor = new THREE.TorusGeometry(1, .28, 12, 32);
  if (id === 'h1'){
    const st = L(0xf3d27a); M(ball, st, .46, .05, .46, 0, .57, 0); M(ball, st, .22, .17, .22, 0, .6, 0);
    const band = M(tor, L(0xff5a4e), .21, .21, .21, 0, .62, 0); band.rotation.x = Math.PI / 2;
  }

    for (const sd of [-1, 1]){
      const loop = M(ball, pink, .12, .08, .05, sd * .11, 0, 0); loop.rotation.z = sd * .35;
      const tail = M(ball, deep, .035, .08, .025, sd * .045, -.08, 0); tail.rotation.z = sd * .45;
    }
    M(ball, deep, .045, .045, .04, 0, 0, .01);
    g.position.set(.15, .56, .16); g.rotation.set(-.35, .25, -.4);
  }
  if (id === 'h3'){ M(ball, L(0x4fb3ff), .31, .22, .31, 0, .53, 0); const rim = M(tor, L(0xffffff), .3, .3, .3, 0, .52, 0); rim.rotation.x = Math.PI / 2; M(ball, L(0xffffff), .075, .075, .075, 0, .77, 0); }
  if (id === 'h4'){ M(ball, L(0x47c16a), .3, .2, .3, 0, .53, 0); M(ball, L(0x2f9a4f), .2, .03, .16, 0, .52, .22); M(ball, L(0xffffff), .035, .035, .035, 0, .73, 0); }
  if (id === 'h5'){
    const gold = L(0xffc93c, { emissive: 0x3a2600, side: THREE.DoubleSide });
    M(new THREE.CylinderGeometry(1, 1, 1, 32, 1, true), gold, .17, .1, .17, 0, .63, 0);
    for (let i = 0; i < 5; i++){ const a = i / 5 * Math.PI * 2; M(new THREE.ConeGeometry(1, 1, 16), gold, .045, .09, .045, Math.sin(a) * .16, .72, Math.cos(a) * .16); M(ball, gold, .025, .025, .025, Math.sin(a) * .16, .77, Math.cos(a) * .16); }
    M(ball, L(0xff5a4e), .03, .03, .03, 0, .64, .17);
  }
  return g;
}
const hatBall = new THREE.SphereGeometry(1, 28, 18);
function dress(ch, s){
  const body = ch.body, old = body.getObjectByName('hat'); if (old) body.remove(old);
  body.children.forEach(o => { if (o.name === 'sprout') o.visible = s.hat === 'h0' || s.hat === 'h2'; if (o.name === 'skin') o.material.color.setHex(wItem(s.col).v); });
  if (s.hat !== 'h0') body.add(buildHat(s.hat));
}
// wardrobe preview of the fall effect: sparkles streaming up past the character
const trailBits = [];
function homeTrail(dt){
  const it = closetOpen && wItem((tryOn || skin).tr);
  if (it && it.cs && Math.random() < dt * 22){
    const m = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ color: it.cs[trailBits.length % it.cs.length], transparent: true }));
    const g = homeChar.g.position, a = Math.random() * Math.PI * 2;
    m.position.set(g.x + Math.cos(a) * .9, g.y + .3 + Math.random() * .4, g.z + Math.sin(a) * .9); m.userData = { t: 0, vy: 1.6 + Math.random() };
    homeScene.add(m); trailBits.push(m);
  }
  for (let i = trailBits.length - 1; i >= 0; i--){
    const m = trailBits[i], u = m.userData; u.t += dt; m.position.y += u.vy * dt;
    m.scale.setScalar(.13 * (1 - u.t / 1.2) + .02); m.material.opacity = 1 - u.t / 1.2;

  }
}
